server:
  tomcat:
    max-swallow-size: 2MB
  port: 8080

spring:
  application:
    name: AIAdolescentMentalHealthSystem
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:mysql://${DB_MYSQL_HOST:127.0.0.1}:${DB_MYSQL_PORT:3306}/${DB_MYSQL_DATABASE:xinyuzhilian}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_MYSQL_USERNAME:root}
    password: ${DB_MYSQL_PASSWORD:}
  data:
    redis:
      host: ${DB_REDIS_HOST:127.0.0.1}
      port: ${DB_REDIS_PORT:6379}

  websocket:
    max-text-message-buffer-size: 5242880
    max-binary-message-buffer-size: 5242880

mybatis-plus:
  mapper-locations: "classpath*:/mapper/**/*.xml"

logging:
  level:
    com:
      xinyuzhilian:
        aiadolescentmentalhealthsystem: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n%wEx"

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:}

jwt:
  # 安全：JWT 签名密钥必须由外部 JWT_SECRET 提供，无公开默认值；缺失或过短时启动即失败（见 JwtProperties.init）
  secret: ${JWT_SECRET}
  expiration: 86400000
  issuer: "AIAdolescentMentalHealthSystem"
  rememberExpiration: 2592000000

dashscope:
  api:
    key: ${DASHSCOPE_API_KEY}
    # 千问AI平台业务空间 ID。带业务空间归属的 API Key 必须携带它，否则鉴权/模型路由会失败。
    # 非机密标识符（不能单独用于鉴权），仍可用 DASHSCOPE_WORKSPACE_ID 覆盖以切换业务空间。
    workspace: ${DASHSCOPE_WORKSPACE_ID:llm-0ixuo0u1xxcrv4gx}

send:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
