packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: true
  unrs-resolver: true

# pnpm 12 起 overrides 不再读 package.json 的 "pnpm" 字段，需迁到工作区配置。
# 这些为 Dependabot 安全固定版本，务必保留。
overrides:
  '@babel/core': 7.29.6
  '@hono/node-server': 1.19.15
  'body-parser': 2.3.0
  'brace-expansion@^1.1.0': 1.1.18
  'brace-expansion@^5.0.0': 5.0.9
  'browserslist': 4.28.7
  'fast-uri': 3.1.6
  'hono': 4.12.34
  'immutable': 5.1.8
  'ip-address': 10.3.1
  'js-yaml': 4.3.1
  'nanoid@^3.0.0': 3.3.18
  'postcss': 8.5.23
  'postcss-selector-parser@^6': 6.1.3
  'postcss-selector-parser@^7': 7.1.3
  'qs': 6.16.0
  'vite': 8.0.16
