packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: true
  unrs-resolver: true

# pnpm 12 起 overrides 不再读 package.json 的 "pnpm" 字段，需迁到工作区配置。
# 这些为 Dependabot 安全固定版本，务必保留。
overrides:
  '@babel/core': 7.29.6
  '@hono/node-server': 1.19.15
  'body-parser': 2.3.0
  'brace-expansion@^1.1.0': 1.1.18
  'brace-expansion@^5.0.0': 5.0.9
  'browserslist': 4.28.7
  'fast-uri': 3.1.6
  'hono': 4.12.34
  'immutable': 5.1.8
  'ip-address': 10.3.1
  'js-yaml': 4.3.1
  'nanoid@^3.0.0': 3.3.18
  'postcss': 8.5.23
  'postcss-selector-parser@^6': 6.1.3
  'postcss-selector-parser@^7': 7.1.3
  'qs': 6.16.0
  'vite': 8.0.16
  # 实验（分支 exp/vite-peer-fix）：@dcloudio/vite-plugin-uni 的 peerDependencies 精确要求
  # vite 5.2.8，而全局 'vite': 8.0.16 会把 apps/mobile 自己的 vite 也钉到 8，
  # 导致 App 端编译崩溃：
  #   Invalid configuration: "output.manualChunks" cannot be used when
  #   "output.codeSplitting" is set to false.
  # 注意：vite 在该插件里是 peerDependency（不是 dependency），所以
  # '@dcloudio/vite-plugin-uni>vite' 这种写法无效（实测只改了 lockfile 里的 peer 记录，
  # 装出来的仍是 8.0.16）。真正决定版本的是引用方 apps/mobile，故按引用方限定作用域。
  # 全局 'vite': 8.0.16 保持不变，其它消费者不受影响。
  '@ai-adolescent-mental-health/mobile>vite': 5.2.8
