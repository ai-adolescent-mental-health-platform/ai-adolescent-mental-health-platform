# 边缘代理(compose 内 nginx)
#
# ⚠️ 当前未被使用:deploy.yml 只上传本文件,但 docker-compose.prod.yml 中没有 nginx 服务,
#    也没有任何服务挂载它。线上 443 的 TLS 实际由宿主机宝塔 nginx 终止,
#    WebSocket 升级转发必须加在【宝塔站点配置】里,改本文件不生效。
#    保留本文件仅为记录意图;若日后把 nginx 纳入 compose,需同时改这两处。
#
# 职责:收口缓存策略,杜绝旧版 HTML 被共享缓存(宝塔 nginx / 运营商 / 代理)留存。
#   - HTML 一律 no-store(Next 静态页默认发 s-maxage=31536000,会被缓存一年)
#   - /_next/static 文件名带内容 hash,一年 immutable 强缓存
# 拓扑:宝塔 nginx(443/TLS)→ 本容器 3200(web-client)/3201(admin-portal)
#   宝塔站点反代目标:web-client 3100 → 3200;admin-portal 3101 → 3201;并清空宝塔侧缓存

# web-client
server {
    listen 80;
    server_name _;

    location /_next/static/ {
        proxy_pass http://web-client:3100;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 小爱倾听 Realtime 音频/视频:WebSocket 升级转发到后端。
    # 必须带 Upgrade/Connection 头,否则 nginx 不会升级协议;proxy_read_timeout 默认
    # 仅 60s,会掐断长会话(官方文档:单次 Realtime 会话最长 120 分钟)。
    location /ws/omni-realtime {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location / {
        proxy_pass http://web-client:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}

# admin-portal
server {
    listen 81;
    server_name _;

    location /_next/static/ {
        proxy_pass http://admin-portal:3101;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://admin-portal:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
