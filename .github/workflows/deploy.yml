name: Deploy

on:
  push:
    branches:
      - main
  # 手动重跑入口。轮换 secret（如 DASHSCOPE_API_KEY）后需要重新生成
  # .env.production 并重建容器，此前只能靠往 main 造一次提交来触发。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/ai-adolescent-mental-health

jobs:
  # ===== 构建 & 推送镜像 =====
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      web_client_image: ${{ steps.images.outputs.web_client_image }}
      admin_portal_image: ${{ steps.images.outputs.admin_portal_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image names
        id: images
        run: |
          prefix="${{ env.IMAGE_NAME_PREFIX }}"
          echo "BACKEND_IMAGE=${prefix}-backend" >> $GITHUB_ENV
          echo "WEB_CLIENT_IMAGE=${prefix}-web-client" >> $GITHUB_ENV
          echo "ADMIN_PORTAL_IMAGE=${prefix}-admin-portal" >> $GITHUB_ENV
          echo "backend_image=${prefix}-backend" >> $GITHUB_OUTPUT
          echo "web_client_image=${prefix}-web-client" >> $GITHUB_OUTPUT
          echo "admin_portal_image=${prefix}-admin-portal" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          # ACR 个人版不接受 buildx 默认附带的 in-toto attestation 清单
          # (denied: unknown manifest class for application/vnd.oci.empty.v1+json)
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push web-client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-client/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.WEB_CLIENT_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_CLIENT_IMAGE }}:latest
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL }}
            NEXT_PUBLIC_WS_BASE_URL=${{ vars.NEXT_PUBLIC_WS_BASE_URL }}
          cache-from: type=gha,scope=web-client
          cache-to: type=gha,scope=web-client,mode=max

      - name: Build and push admin-portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-portal/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.ADMIN_PORTAL_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.ADMIN_PORTAL_IMAGE }}:latest
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL }}
          cache-from: type=gha,scope=admin-portal
          cache-to: type=gha,scope=admin-portal,mode=max

  # ===== 部署到服务器 =====
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
      WEB_CLIENT_IMAGE: ${{ needs.build.outputs.web_client_image }}
      ADMIN_PORTAL_IMAGE: ${{ needs.build.outputs.admin_portal_image }}
      # ---- 部署目标 ----
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # ---- 应用配置 ----
      SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      NEXT_PUBLIC_WS_BASE_URL: ${{ vars.NEXT_PUBLIC_WS_BASE_URL }}
      # ---- 端口 ----
      BACKEND_PORT: ${{ vars.BACKEND_PORT }}
      WEB_CLIENT_PORT: ${{ vars.WEB_CLIENT_PORT }}
      ADMIN_PORTAL_PORT: ${{ vars.ADMIN_PORTAL_PORT }}
      # ---- MySQL ----
      DB_MYSQL_HOST: ${{ vars.DB_MYSQL_HOST }}
      DB_MYSQL_PORT: ${{ vars.DB_MYSQL_PORT }}
      DB_MYSQL_DATABASE: ${{ vars.DB_MYSQL_DATABASE }}
      DB_MYSQL_USERNAME: ${{ secrets.DB_MYSQL_USERNAME || vars.DB_MYSQL_USERNAME }}
      DB_MYSQL_PASSWORD: ${{ secrets.DB_MYSQL_PASSWORD }}
      # ---- Redis ----
      DB_REDIS_HOST: ${{ vars.DB_REDIS_HOST }}
      DB_REDIS_PORT: ${{ vars.DB_REDIS_PORT }}
      DB_REDIS_PASSWORD: ${{ secrets.DB_REDIS_PASSWORD || vars.DB_REDIS_PASSWORD || '' }}
      # ---- JWT ----
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # ---- AI ----
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # ---- 微信 ----
      WX_APP_ID: ${{ secrets.WX_APP_ID || vars.WX_APP_ID }}
      WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
      WX_GZH_APP_ID: ${{ secrets.WX_GZH_APP_ID || vars.WX_GZH_APP_ID }}
      WX_GZH_SECRET: ${{ secrets.WX_GZH_SECRET }}
      WX_GZH_CALLBACK_BASE_URL: ${{ vars.WX_GZH_CALLBACK_BASE_URL }}
      # ---- 阿里云 OSS ----
      ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_BUCKET_NAME: ${{ vars.ALIYUN_OSS_BUCKET_NAME }}
      # ---- 邮件 ----
      MAIL_HOST: ${{ vars.MAIL_HOST }}
      MAIL_PORT: ${{ vars.MAIL_PORT }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME || vars.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      # ---- RabbitMQ（可选）----
      RABBITMQ_USER: ${{ vars.RABBITMQ_USER || 'guest' }}
      RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS || 'guest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets and vars
        run: |
          set -euo pipefail

          # === 核心必需（部署失败如果没有这些） ===
          required=(
            BACKEND_URL
            NEXT_PUBLIC_WS_BASE_URL
            DEPLOY_HOST
            DEPLOY_USER
            DEPLOY_SSH_KEY
            DEPLOY_PATH
            DB_MYSQL_USERNAME
            DB_MYSQL_PASSWORD
            JWT_SECRET
          )

          missing=""
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then missing="$missing  $key\n"; fi
          done

          if [ -n "$missing" ]; then
            printf '%b' "::error::Missing REQUIRED secrets/vars:\n$missing"
            exit 1
          fi

          # === 可选服务（缺少时 warn 但不阻断部署） ===
          optional=(
            DASHSCOPE_API_KEY
            WX_APP_ID
            WX_APP_SECRET
            WX_GZH_APP_ID
            WX_GZH_SECRET
            WX_GZH_CALLBACK_BASE_URL
            ALIYUN_OSS_ENDPOINT
            ALIYUN_OSS_ACCESS_KEY_ID
            ALIYUN_OSS_ACCESS_KEY_SECRET
            ALIYUN_OSS_BUCKET_NAME
            MAIL_HOST
            MAIL_PORT
            MAIL_USERNAME
            MAIL_PASSWORD
            DB_REDIS_PASSWORD
          )

          for key in "${optional[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::warning::Optional secret/var '$key' is empty — related feature will be disabled"
            fi
          done

          echo "Core required secrets and variables are present."

      - name: Generate .env.production
        run: |
          set -euo pipefail

          env_file="deploy/.env.production"
          cat > "$env_file" <<'ENVEOF'
          # 由 GitHub Actions 自动生成，请勿手动修改
          SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
          JAVA_OPTS=${JAVA_OPTS:--Xmx512m}
          BACKEND_URL=${BACKEND_URL}
          NEXT_PUBLIC_WS_BASE_URL=${NEXT_PUBLIC_WS_BASE_URL}
          BACKEND_PORT=${BACKEND_PORT:-8080}
          WEB_CLIENT_PORT=${WEB_CLIENT_PORT:-3100}
          ADMIN_PORTAL_PORT=${ADMIN_PORTAL_PORT:-3101}
          DB_MYSQL_HOST=${DB_MYSQL_HOST}
          DB_MYSQL_PORT=${DB_MYSQL_PORT:-3306}
          DB_MYSQL_DATABASE=${DB_MYSQL_DATABASE:-xinyuzhilian}
          DB_MYSQL_USERNAME=${DB_MYSQL_USERNAME}
          DB_MYSQL_PASSWORD=${DB_MYSQL_PASSWORD}
          DB_REDIS_HOST=${DB_REDIS_HOST}
          DB_REDIS_PORT=${DB_REDIS_PORT:-6379}
          DB_REDIS_PASSWORD=${DB_REDIS_PASSWORD:-}
          JWT_SECRET=${JWT_SECRET}
          DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
          WX_APP_ID=${WX_APP_ID}
          WX_APP_SECRET=${WX_APP_SECRET}
          WX_GZH_APP_ID=${WX_GZH_APP_ID}
          WX_GZH_SECRET=${WX_GZH_SECRET}
          WX_GZH_CALLBACK_BASE_URL=${WX_GZH_CALLBACK_BASE_URL}
          ALIYUN_OSS_ENDPOINT=${ALIYUN_OSS_ENDPOINT}
          ALIYUN_OSS_ACCESS_KEY_ID=${ALIYUN_OSS_ACCESS_KEY_ID}
          ALIYUN_OSS_ACCESS_KEY_SECRET=${ALIYUN_OSS_ACCESS_KEY_SECRET}
          ALIYUN_OSS_BUCKET_NAME=${ALIYUN_OSS_BUCKET_NAME}
          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          RABBITMQ_USER=${RABBITMQ_USER:-guest}
          RABBITMQ_PASS=${RABBITMQ_PASS:-guest}
          ENVEOF

          # 替换变量引用为实际值
          while IFS= read -r line; do
            eval "echo \"$line\""
          done < "$env_file" > "$env_file.tmp"
          mv "$env_file.tmp" "$env_file"

          echo "Generated deploy/.env.production ($(wc -l < "$env_file") lines)"

      - name: Configure SSH
        timeout-minutes: 2
        run: |
          set -euo pipefail

          echo "Testing connectivity to ${DEPLOY_HOST}:${DEPLOY_PORT:-22}..."

          # 测试服务器是否可达
          if ! timeout 10 bash -c "echo >/dev/tcp/${DEPLOY_HOST}/${DEPLOY_PORT:-22}" 2>/dev/null; then
            echo "::error::Cannot reach ${DEPLOY_HOST}:${DEPLOY_PORT:-22}. Check firewall/network."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # keyscan 带重试
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH host key added."
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep 3
          done

          # 验证连接
          if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "echo 'SSH OK'" 2>&1; then
            echo "SSH connection verified."
          else
            echo "::warning::SSH connection test failed — deploy will attempt anyway."
          fi

      - name: Deploy to server
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"

          echo "::group::Upload files to server"
          # 确保目标目录存在
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_PATH/deploy/nginx $DEPLOY_PATH/infra/sql"

          # 上传文件
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            deploy/.env.production \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.production"

          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            deploy/docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/docker-compose.prod.yml"

          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            deploy/nginx/default.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/nginx/default.conf"

          # 上传 SQL 初始化脚本（如果存在）
          if ls infra/sql/*.sql 1>/dev/null 2>&1; then
            scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
              infra/sql/*.sql \
              "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/infra/sql/"
          fi

          echo "::endgroup::"

          echo "::group::Pull images and restart services"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<REMOTE
          set -euo pipefail

          # ACR 登录
          printf '%s' '${ACR_PASSWORD}' | docker login ${ACR_REGISTRY} -u "${ACR_USERNAME}" --password-stdin
          trap 'docker logout ${ACR_REGISTRY} >/dev/null 2>&1 || true' EXIT

          cd "${DEPLOY_PATH}"

          # 导出镜像变量供 docker compose 使用
          export IMAGE_TAG="${IMAGE_TAG}"
          export BACKEND_IMAGE="${BACKEND_IMAGE}:${IMAGE_TAG}"
          export WEB_CLIENT_IMAGE="${WEB_CLIENT_IMAGE}:${IMAGE_TAG}"
          export ADMIN_PORTAL_IMAGE="${ADMIN_PORTAL_IMAGE}:${IMAGE_TAG}"

          # 拉取新镜像
          echo "Pulling images..."
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml pull

          # 滚动更新（保持旧容器运行直到新容器就绪）
          echo "Deploying services..."
          docker compose --env-file .env.production -f deploy/docker-compose.prod.yml up -d --remove-orphans

          # 清理旧镜像
          echo "Pruning old images..."
          docker image prune -af --filter "until=24h" || true
          REMOTE
          echo "::endgroup::"

      - name: Health check
        run: |
          set -euo pipefail

          echo "Verifying containers are running..."

          check_container() {
            local name="$1"
            local label="$2"
            local attempt=1
            local max_attempts=12

            while [ $attempt -le $max_attempts ]; do
              if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "docker ps --filter name=$name --filter status=running --format '{{.Names}}' 2>/dev/null | grep -q ."; then
                echo "  ✓ $label container is running"
                return 0
              fi
              echo "  ... waiting for $label ($attempt/$max_attempts)"
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "::warning::$label container not running after ${max_attempts} attempts"
            return 1
          }

          check_container "aiamh-backend" "backend"
          check_container "aiamh-web-client" "web-client"
          check_container "aiamh-admin-portal" "admin-portal"

          echo "All containers are running!"

          # Quick HTTP smoke test (non-blocking, warn only)
          echo ""
          echo "HTTP smoke test..."
          for svc in "backend:8080/health" "web-client:3100" "admin-portal:3101"; do
            name="${svc%%:*}"
            url="http://localhost:${svc#*:}"
            if ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "curl -sfo /dev/null -w '%{http_code}' --max-time 5 '$url'" 2>/dev/null | grep -qE '^(200|301|302|401|403)$'; then
              echo "  ✓ $name responds"
            else
              echo "  ⚠ $name not responding yet (may need warm-up)"
            fi
          done

      - name: Deploy summary
        if: always()
        run: |
          echo "### 🚀 Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ needs.build.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend image | \`${{ needs.build.outputs.backend_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web client image | \`${{ needs.build.outputs.web_client_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Admin portal image | \`${{ needs.build.outputs.admin_portal_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
